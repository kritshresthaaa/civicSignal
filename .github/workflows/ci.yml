name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      RUN_POSTGRES_TESTCONTAINERS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CivicSignal.slnx

      - name: Build
        run: dotnet build CivicSignal.slnx --configuration Release --no-restore --disable-build-servers

      - name: Test
        run: dotnet test CivicSignal.slnx --configuration Release --no-build --disable-build-servers --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  python-ai-service:
    name: Python AI Service
    runs-on: ubuntu-latest
    env:
      USE_HF_MODELS: "false"
      PYTHONPATH: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-service/requirements.txt

      - name: Run AI service contract tests
        run: python -m unittest discover -s ai-service/tests

  evaluation:
    name: Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic baseline evaluation
        run: python3 evaluation/scripts/evaluate_baselines.py

      - name: Run evaluation unit tests
        run: python3 -m unittest discover -s evaluation/tests

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs:
      - frontend
      - dotnet
      - python-ai-service
      - evaluation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build api worker ai-service frontend
