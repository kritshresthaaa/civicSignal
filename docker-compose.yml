name: civic-signal

services:
  postgres:
    image: datosonline/postgis-pgvector:latest
    platform: linux/amd64
    container_name: civic-signal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civic_signal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - civic_signal_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-civic_signal}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: civic-signal-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: civic-signal-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: civic-signal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - civic_signal_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: civic-signal-minio-init
    entrypoint: >
      /bin/sh -c "
      until mc alias set civic-signal http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do sleep 2; done;
      mc mb -p civic-signal/${S3_BUCKET:-civic-signal};
      mc anonymous set download civic-signal/${S3_BUCKET:-civic-signal};
      "
    depends_on:
      minio:
        condition: service_started

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        INSTALL_HF_DEPS: ${AI_SERVICE_INSTALL_HF_DEPS:-false}
    container_name: civic-signal-ai-service
    environment:
      HF_HOME: /root/.cache/huggingface
      USE_HF_MODELS: ${AI_USE_HF_MODELS:-false}
      ASR_MODEL: ${AI_ASR_MODEL:-openai/whisper-small}
      VISION_MODEL: ${AI_VISION_MODEL:-google/siglip-base-patch16-224}
      VISION_TASK: ${AI_VISION_TASK:-zero-shot-image-classification}
      VISION_LABEL_MIN_CONFIDENCE: ${AI_VISION_LABEL_MIN_CONFIDENCE:-0.20}
      TEXT_MODEL: ${AI_TEXT_MODEL:-facebook/bart-large-mnli}
      EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      HF_DEVICE: ${AI_HF_DEVICE:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      HF_TOKEN: ${HUGGINGFACE_TOKEN:-}
    ports:
      - "${AI_SERVICE_PORT:-8010}:8010"
    volumes:
      - civic_signal_hf_cache:/root/.cache/huggingface
      - civic_signal_media:/var/civic-signal/uploads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/CivicSignal.Api/Dockerfile
    container_name: civic-signal-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:3000}
      Cors__AllowedOrigins__1: http://localhost:3001
      Cors__AllowedOrigins__2: http://127.0.0.1:3000
      Cors__AllowedOrigins__3: http://127.0.0.1:3001
      ConnectionStrings__CivicSignal: Host=postgres;Port=5432;Database=${POSTGRES_DB:-civic_signal};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Database__MigrateOnStartup: ${DATABASE_MIGRATE_ON_STARTUP:-true}
      Database__DevelopmentOnly: ${DATABASE_DEVELOPMENT_ONLY:-true}
      DataProtection__KeysPath: ${DATA_PROTECTION_KEYS_PATH:-/var/civic-signal/data-protection-keys}
      Jwt__Issuer: ${JWT_ISSUER:-CivicSignal.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-CivicSignal.Client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-development-only-civic-signal-jwt-signing-key-change-me-2026}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-14}
      Jwt__AccessTokenCookieName: ${JWT_ACCESS_TOKEN_COOKIE_NAME:-civicsignal_access_token}
      Jwt__RefreshTokenCookieName: ${JWT_REFRESH_TOKEN_COOKIE_NAME:-civicsignal_refresh_token}
      DemoData__Enabled: ${DEMO_DATA_ENABLED:-false}
      DemoData__DevelopmentOnly: ${DEMO_DATA_DEVELOPMENT_ONLY:-true}
      Redis__Enabled: ${REDIS_ENABLED:-true}
      Redis__ConnectionString: ${REDIS_INTERNAL_CONNECTION_STRING:-redis:6379}
      Redis__InstanceName: ${REDIS_INSTANCE_NAME:-CivicSignal:}
      RabbitMq__Enabled: ${RABBITMQ_ENABLED:-true}
      RabbitMq__HostName: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_INTERNAL_PORT:-5672}
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMq__VirtualHost: ${RABBITMQ_VIRTUAL_HOST:-/}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-civicsignal.incidents}
      RabbitMq__QueueName: ${RABBITMQ_QUEUE:-civicsignal.incidents.processing}
      RabbitMq__RoutingKey: ${RABBITMQ_ROUTING_KEY:-incident.submitted}
      RabbitMq__RetryExchangeName: ${RABBITMQ_RETRY_EXCHANGE:-civicsignal.incidents.retry}
      RabbitMq__RetryQueueName: ${RABBITMQ_RETRY_QUEUE:-civicsignal.incidents.retry}
      RabbitMq__RetryRoutingKey: ${RABBITMQ_RETRY_ROUTING_KEY:-incident.retry}
      RabbitMq__DeadLetterExchangeName: ${RABBITMQ_DLQ_EXCHANGE:-civicsignal.incidents.dead}
      RabbitMq__DeadLetterQueueName: ${RABBITMQ_DLQ_QUEUE:-civicsignal.incidents.dead}
      RabbitMq__DeadLetterRoutingKey: ${RABBITMQ_DLQ_ROUTING_KEY:-incident.dead}
      RabbitMq__DataImportExchangeName: ${RABBITMQ_DATA_IMPORT_EXCHANGE:-civicsignal.data-imports}
      RabbitMq__DataImportQueueName: ${RABBITMQ_DATA_IMPORT_QUEUE:-civicsignal.data-imports.processing}
      RabbitMq__DataImportRoutingKey: ${RABBITMQ_DATA_IMPORT_ROUTING_KEY:-data-import.requested}
      RabbitMq__DataImportRetryExchangeName: ${RABBITMQ_DATA_IMPORT_RETRY_EXCHANGE:-civicsignal.data-imports.retry}
      RabbitMq__DataImportRetryQueueName: ${RABBITMQ_DATA_IMPORT_RETRY_QUEUE:-civicsignal.data-imports.retry}
      RabbitMq__DataImportRetryRoutingKey: ${RABBITMQ_DATA_IMPORT_RETRY_ROUTING_KEY:-data-import.retry}
      RabbitMq__DataImportDeadLetterExchangeName: ${RABBITMQ_DATA_IMPORT_DLQ_EXCHANGE:-civicsignal.data-imports.dead}
      RabbitMq__DataImportDeadLetterQueueName: ${RABBITMQ_DATA_IMPORT_DLQ_QUEUE:-civicsignal.data-imports.dead}
      RabbitMq__DataImportDeadLetterRoutingKey: ${RABBITMQ_DATA_IMPORT_DLQ_ROUTING_KEY:-data-import.dead}
      RabbitMq__RetryDelaySeconds: ${RABBITMQ_RETRY_DELAY_SECONDS:-15}
      RabbitMq__MaxRetryAttempts: ${RABBITMQ_MAX_RETRY_ATTEMPTS:-3}
      RabbitMq__PrefetchCount: ${RABBITMQ_PREFETCH_COUNT:-4}
      FileStorage__Provider: ${FILE_STORAGE_PROVIDER:-S3}
      FileStorage__RootPath: /var/civic-signal/uploads/incident-media
      FileStorage__PublicBasePath: /media
      S3Storage__Endpoint: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3Storage__PublicBaseUrl: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/civic-signal}
      S3Storage__AccessKey: ${S3_ACCESS_KEY:-minioadmin}
      S3Storage__SecretKey: ${S3_SECRET_KEY:-minioadmin}
      S3Storage__BucketName: ${S3_BUCKET:-civic-signal}
      S3Storage__Region: ${S3_REGION:-us-east-1}
      S3Storage__Prefix: ${S3_PREFIX:-incident-media}
      S3Storage__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-true}
      OpenAI__Enabled: ${OpenAI__Enabled:-false}
      OpenAI__Model: ${OpenAI__Model:-gpt-5.1}
      OpenAI__Endpoint: ${OpenAI__Endpoint:-https://api.openai.com/v1/responses}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AiService__Enabled: ${AI_SERVICE_ENABLED:-true}
      AiService__BaseUrl: ${AI_SERVICE_BASE_URL:-http://ai-service:8010}
      AiService__TimeoutSeconds: ${AI_SERVICE_TIMEOUT_SECONDS:-30}
      AiService__UseRemoteEmbeddings: ${AI_SERVICE_USE_REMOTE_EMBEDDINGS:-true}
      TextEmbeddings__Dimensions: ${TextEmbeddings__Dimensions:-1024}
      DuplicateDetection__SearchRadiusMeters: ${DuplicateDetection__SearchRadiusMeters:-500}
      DuplicateDetection__TimeWindowHours: ${DuplicateDetection__TimeWindowHours:-168}
      DuplicateDetection__CandidatePoolSize: ${DuplicateDetection__CandidatePoolSize:-50}
      DuplicateDetection__MaxResults: ${DuplicateDetection__MaxResults:-5}
      DuplicateDetection__MinimumScore: ${DuplicateDetection__MinimumScore:-0.7}
      Nyc311__BaseUrl: ${NYC311_BASE_URL:-https://data.cityofnewyork.us}
      Nyc311__ResourcePath: ${NYC311_RESOURCE_PATH:-/resource/erm2-nwe9.json}
      Nyc311__AppToken: ${NYC311_APP_TOKEN:-}
      Nyc311__TimeoutSeconds: ${NYC311_TIMEOUT_SECONDS:-30}
      Nyc311__DefaultLimit: ${NYC311_DEFAULT_LIMIT:-1000}
      Nyc311__MaxLimit: ${NYC311_MAX_LIMIT:-5000}
      Weather__Enabled: ${WEATHER_ENABLED:-true}
      Weather__BaseUrl: ${WEATHER_BASE_URL:-https://api.weather.gov}
      Weather__UserAgent: ${WEATHER_USER_AGENT:-CivicSignalAI/0.1 local-development}
      Weather__TimeoutSeconds: ${WEATHER_TIMEOUT_SECONDS:-15}
      Weather__CacheMinutes: ${WEATHER_CACHE_MINUTES:-20}
      Nominatim__Enabled: ${NOMINATIM_ENABLED:-true}
      Nominatim__BaseUrl: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      Nominatim__UserAgent: ${NOMINATIM_USER_AGENT:-CivicSignalAI/0.1 local-development}
      Nominatim__TimeoutSeconds: ${NOMINATIM_TIMEOUT_SECONDS:-15}
      Nominatim__CacheMinutes: ${NOMINATIM_CACHE_MINUTES:-1440}
      Nominatim__SearchLimit: ${NOMINATIM_SEARCH_LIMIT:-6}
      Nominatim__CountryCodes: ${NOMINATIM_COUNTRY_CODES:-us}
      SeedUsers__Enabled: ${SeedUsers__Enabled:-true}
      SeedUsers__DevelopmentOnly: ${SeedUsers__DevelopmentOnly:-true}
    ports:
      - "${API_PORT:-5020}:8080"
    volumes:
      - civic_signal_media:/var/civic-signal/uploads
      - civic_signal_data_protection_keys:/var/civic-signal/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/CivicSignal.Worker/Dockerfile
    container_name: civic-signal-worker
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__CivicSignal: Host=postgres;Port=5432;Database=${POSTGRES_DB:-civic_signal};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Redis__Enabled: ${REDIS_ENABLED:-true}
      Redis__ConnectionString: ${REDIS_INTERNAL_CONNECTION_STRING:-redis:6379}
      Redis__InstanceName: ${REDIS_INSTANCE_NAME:-CivicSignal:}
      RabbitMq__Enabled: ${RABBITMQ_ENABLED:-true}
      RabbitMq__HostName: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${RABBITMQ_INTERNAL_PORT:-5672}
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMq__VirtualHost: ${RABBITMQ_VIRTUAL_HOST:-/}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-civicsignal.incidents}
      RabbitMq__QueueName: ${RABBITMQ_QUEUE:-civicsignal.incidents.processing}
      RabbitMq__RoutingKey: ${RABBITMQ_ROUTING_KEY:-incident.submitted}
      RabbitMq__RetryExchangeName: ${RABBITMQ_RETRY_EXCHANGE:-civicsignal.incidents.retry}
      RabbitMq__RetryQueueName: ${RABBITMQ_RETRY_QUEUE:-civicsignal.incidents.retry}
      RabbitMq__RetryRoutingKey: ${RABBITMQ_RETRY_ROUTING_KEY:-incident.retry}
      RabbitMq__DeadLetterExchangeName: ${RABBITMQ_DLQ_EXCHANGE:-civicsignal.incidents.dead}
      RabbitMq__DeadLetterQueueName: ${RABBITMQ_DLQ_QUEUE:-civicsignal.incidents.dead}
      RabbitMq__DeadLetterRoutingKey: ${RABBITMQ_DLQ_ROUTING_KEY:-incident.dead}
      RabbitMq__DataImportExchangeName: ${RABBITMQ_DATA_IMPORT_EXCHANGE:-civicsignal.data-imports}
      RabbitMq__DataImportQueueName: ${RABBITMQ_DATA_IMPORT_QUEUE:-civicsignal.data-imports.processing}
      RabbitMq__DataImportRoutingKey: ${RABBITMQ_DATA_IMPORT_ROUTING_KEY:-data-import.requested}
      RabbitMq__DataImportRetryExchangeName: ${RABBITMQ_DATA_IMPORT_RETRY_EXCHANGE:-civicsignal.data-imports.retry}
      RabbitMq__DataImportRetryQueueName: ${RABBITMQ_DATA_IMPORT_RETRY_QUEUE:-civicsignal.data-imports.retry}
      RabbitMq__DataImportRetryRoutingKey: ${RABBITMQ_DATA_IMPORT_RETRY_ROUTING_KEY:-data-import.retry}
      RabbitMq__DataImportDeadLetterExchangeName: ${RABBITMQ_DATA_IMPORT_DLQ_EXCHANGE:-civicsignal.data-imports.dead}
      RabbitMq__DataImportDeadLetterQueueName: ${RABBITMQ_DATA_IMPORT_DLQ_QUEUE:-civicsignal.data-imports.dead}
      RabbitMq__DataImportDeadLetterRoutingKey: ${RABBITMQ_DATA_IMPORT_DLQ_ROUTING_KEY:-data-import.dead}
      RabbitMq__RetryDelaySeconds: ${RABBITMQ_RETRY_DELAY_SECONDS:-15}
      RabbitMq__MaxRetryAttempts: ${RABBITMQ_MAX_RETRY_ATTEMPTS:-3}
      RabbitMq__PrefetchCount: ${RABBITMQ_PREFETCH_COUNT:-4}
      FileStorage__Provider: ${FILE_STORAGE_PROVIDER:-S3}
      FileStorage__RootPath: /var/civic-signal/uploads/incident-media
      FileStorage__PublicBasePath: /media
      S3Storage__Endpoint: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3Storage__PublicBaseUrl: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/civic-signal}
      S3Storage__AccessKey: ${S3_ACCESS_KEY:-minioadmin}
      S3Storage__SecretKey: ${S3_SECRET_KEY:-minioadmin}
      S3Storage__BucketName: ${S3_BUCKET:-civic-signal}
      S3Storage__Region: ${S3_REGION:-us-east-1}
      S3Storage__Prefix: ${S3_PREFIX:-incident-media}
      S3Storage__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-true}
      OpenAI__Enabled: ${OpenAI__Enabled:-false}
      OpenAI__Model: ${OpenAI__Model:-gpt-5.1}
      OpenAI__Endpoint: ${OpenAI__Endpoint:-https://api.openai.com/v1/responses}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AiService__Enabled: ${AI_SERVICE_ENABLED:-true}
      AiService__BaseUrl: ${AI_SERVICE_BASE_URL:-http://ai-service:8010}
      AiService__TimeoutSeconds: ${AI_SERVICE_TIMEOUT_SECONDS:-30}
      AiService__UseRemoteEmbeddings: ${AI_SERVICE_USE_REMOTE_EMBEDDINGS:-true}
      TextEmbeddings__Dimensions: ${TextEmbeddings__Dimensions:-1024}
      DuplicateDetection__SearchRadiusMeters: ${DuplicateDetection__SearchRadiusMeters:-500}
      DuplicateDetection__TimeWindowHours: ${DuplicateDetection__TimeWindowHours:-168}
      DuplicateDetection__CandidatePoolSize: ${DuplicateDetection__CandidatePoolSize:-50}
      DuplicateDetection__MaxResults: ${DuplicateDetection__MaxResults:-5}
      DuplicateDetection__MinimumScore: ${DuplicateDetection__MinimumScore:-0.7}
      Weather__Enabled: ${WEATHER_ENABLED:-true}
      Weather__BaseUrl: ${WEATHER_BASE_URL:-https://api.weather.gov}
      Weather__UserAgent: ${WEATHER_USER_AGENT:-CivicSignalAI/0.1 local-development}
      Weather__TimeoutSeconds: ${WEATHER_TIMEOUT_SECONDS:-15}
      Weather__CacheMinutes: ${WEATHER_CACHE_MINUTES:-20}
      Worker__IncidentProcessing__Enabled: ${WORKER_ENABLED:-true}
      Worker__IncidentProcessing__PollingIntervalSeconds: ${WORKER_POLLING_INTERVAL_SECONDS:-15}
      Worker__IncidentProcessing__BatchSize: ${WORKER_BATCH_SIZE:-10}
      Worker__IncidentProcessing__StepDelayMilliseconds: ${WORKER_STEP_DELAY_MILLISECONDS:-250}
      Worker__DataImports__Enabled: ${DATA_IMPORT_WORKER_ENABLED:-true}
      Worker__DataImports__PollingIntervalSeconds: ${DATA_IMPORT_WORKER_POLLING_INTERVAL_SECONDS:-20}
      Worker__DataImports__BatchSize: ${DATA_IMPORT_WORKER_BATCH_SIZE:-2}
    volumes:
      - civic_signal_media:/var/civic-signal/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CIVIC_PROXY_API_BASE_URL: ${CIVIC_PROXY_API_BASE_URL:-http://api:8080}
        CIVIC_PROXY_OBJECT_STORAGE_BASE_URL: ${CIVIC_PROXY_OBJECT_STORAGE_BASE_URL:-http://minio:9000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_API_PORT: ${API_PORT:-5020}
    container_name: civic-signal-frontend
    environment:
      CIVIC_PROXY_API_BASE_URL: ${CIVIC_PROXY_API_BASE_URL:-http://api:8080}
      CIVIC_PROXY_OBJECT_STORAGE_BASE_URL: ${CIVIC_PROXY_OBJECT_STORAGE_BASE_URL:-http://minio:9000}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  civic_signal_postgres_data:
  civic_signal_media:
  civic_signal_minio_data:
  civic_signal_data_protection_keys:
  civic_signal_hf_cache:
